name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            ninja-build

      - name: Configure Debug build
        run: cmake --preset debug

      - name: Build Debug firmware
        run: cmake --build --preset debug --parallel

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: usb_midi_pedal-debug
          path: build/debug/src/usb_midi_pedal.uf2
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            ninja-build \
            ruby

      - name: Configure host tests
        run: cmake --preset host-tests

      - name: Build host tests
        run: cmake --build --preset host-tests --parallel

      - name: Run tests
        run: ctest --test-dir build/host-tests --output-on-failure
